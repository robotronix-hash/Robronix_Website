<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotronix | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00adb5;
            --bg: #111;
            --card-bg: #1e1e1e;
            --text: #eee;
            --text-muted: #aaa;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }
        header h1 { margin: 0; color: var(--primary); }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: var(--primary);
        }
        
        /* Grid Layouts */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        /* Card Styling */
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .card h3 { margin: 10px 0 5px 0; }
        .card p { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 15px 0; }
        
        .card a {
            display: inline-block;
            margin: 0 5px;
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
        .card a:hover { text-decoration: underline; }
        
        /* Event Specific */
        .event-card {
            text-align: left;
        }
        .event-card img {
            height: 150px;
        }
        .event-btn {
            display: block;
            background: var(--primary);
            color: #000;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
        }
        .event-btn:hover { text-decoration: none; opacity: 0.9; }
        
        .loading { text-align: center; color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>

    <header>
        <h1>ROBOTRONIX</h1>
        <p>Innovating the Future of Robotics</p>
    </header>

    <div class="container">
        
        <!-- TEAM SECTION -->
        <section>
            <h2>Meet Our Team</h2>
            <div id="public-members-container" class="grid-container">
                <p class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading team members...</p>
            </div>
        </section>

        <!-- EVENTS SECTION -->
        <section>
            <h2>Upcoming Events</h2>
            <div id="public-events-container" class="grid-container">
                <p class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading events...</p>
            </div>
        </section>

    </div>

    <!-- FIREBASE CONNECTION & DISPLAY SCRIPT -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // 1. Fetch and Display Members
        onSnapshot(query(collection(db, 'members'), orderBy('createdAt', 'desc')), (snapshot) => {
            const container = document.getElementById('public-members-container');
            if (snapshot.empty) {
                container.innerHTML = '<p class="loading">No team members added yet.</p>';
                return;
            }
            
            container.innerHTML = snapshot.docs.map(doc => {
                const m = doc.data();
                return `
                    <div class="card">
                        <img src="${m.photoUrl}" alt="${m.name}">
                        <h3>${m.name}</h3>
                        <p>${m.role}</p>
                        <div>
                            ${m.linkedin && m.linkedin !== '#' ? `<a href="${m.linkedin}" target="_blank"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>` : ''}
                            ${m.instagram && m.instagram !== '#' ? `<a href="${m.instagram}" target="_blank"><i class="fa-brands fa-instagram"></i> Instagram</a>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        });

        // 2. Fetch and Display Events
        onSnapshot(query(collection(db, 'events'), orderBy('createdAt', 'desc')), (snapshot) => {
            const container = document.getElementById('public-events-container');
            if (snapshot.empty) {
                container.innerHTML = '<p class="loading">No upcoming events at the moment.</p>';
                return;
            }
            
            container.innerHTML = snapshot.docs.map(doc => {
                const ev = doc.data();
                return `
                    <div class="card event-card">
                        <img src="${ev.bannerUrl}" alt="${ev.title}">
                        <h3>${ev.title}</h3>
                        <p style="color: var(--primary); font-weight: bold;"><i class="fa-regular fa-calendar"></i> ${ev.date}</p>
                        <p>${ev.description}</p>
                        ${ev.link && ev.link !== '#' ? `<a href="${ev.link}" target="_blank" class="event-btn">Learn More / Register</a>` : ''}
                    </div>
                `;
            }).join('');
        });
    </script>

</body>
</html>
