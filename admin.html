<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotronix Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00adb5; --bg: #111; --card: #1e1e1e; --text: #eee; --danger: #ff4b4b; }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .hidden { display: none !important; }
        input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:hover { opacity: 0.9; }
        button.danger { background: var(--danger); color: #fff; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-tabs button { flex: 1; background: #222; color: #fff; }
        .nav-tabs button.active { background: var(--primary); color: #000; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-row { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
        .item-row img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; margin-right: 15px; }
        .item-info { flex: 1; }
        .item-info h4 { margin: 0 0 5px 0; }
        .item-info p { margin: 0; color: #aaa; font-size: 0.85rem; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: #000; padding: 12px 20px; border-radius: 6px; font-weight: bold; display: none; z-index: 1000; }
        .toast.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-section" class="card" style="max-width: 400px; margin: 80px auto;">
            <h2>Robotronix Admin</h2>
            <div id="login-error" style="color: var(--danger); font-size: 0.9rem;"></div>
            <input type="email" id="login-email" placeholder="Admin Email">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-btn"><i class="fa-solid fa-right-to-bracket"></i> LOG IN</button>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="dashboard-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>Dashboard</h1>
                <button id="logout-btn" class="danger" style="width: auto; padding: 8px 16px;"><i class="fa-solid fa-power-off"></i> Logout</button>
            </div>

            <!-- TABS -->
            <div class="nav-tabs">
                <button id="tab-members-btn" class="active"><i class="fa-solid fa-users"></i> Team Members</button>
                <button id="tab-events-btn"><i class="fa-solid fa-calendar-days"></i> Events</button>
            </div>

            <!-- MEMBERS TAB -->
            <div id="tab-members">
                <div class="card">
                    <h3>Add Team Member</h3>
                    <form id="member-form">
                        <div class="grid">
                            <input type="text" id="member-name" placeholder="Full Name" required>
                            <input type="text" id="member-role" placeholder="Role / Position (e.g. Team Lead)" required>
                        </div>
                        <div class="grid">
                            <input type="url" id="member-linkedin" placeholder="LinkedIn Profile URL">
                            <input type="url" id="member-instagram" placeholder="Instagram Profile URL">
                        </div>
                        <label style="font-size: 0.85rem; color: #aaa;">Member Photo:</label>
                        <input type="file" id="member-photo" accept="image/*" required>
                        <button type="submit"><i class="fa-solid fa-user-plus"></i> Save Member</button>
                    </form>
                </div>

                <div class="card">
                    <h3>Current Members</h3>
                    <div id="members-list">Loading members...</div>
                </div>
            </div>

            <!-- EVENTS TAB -->
            <div id="tab-events" class="hidden">
                <div class="card">
                    <h3>Add Event</h3>
                    <form id="event-form">
                        <input type="text" id="event-title" placeholder="Event Title" required>
                        <div class="grid">
                            <input type="date" id="event-date" required>
                            <input type="url" id="event-link" placeholder="Registration / Info URL">
                        </div>
                        <textarea id="event-desc" rows="3" placeholder="Short Event Description" required></textarea>
                        <label style="font-size: 0.85rem; color: #aaa;">Event Banner / Photo:</label>
                        <input type="file" id="event-photo" accept="image/*" required>
                        <button type="submit"><i class="fa-solid fa-calendar-plus"></i> Save Event</button>
                    </form>
                </div>

                <div class="card">
                    <h3>Current Events</h3>
                    <div id="events-list">Loading events...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="admin.js"></script>
</body>
</html>
